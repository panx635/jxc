<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>开单动线原型 v1 · jxc #15</title>
<!--
  PROTOTYPE — 开单动线 v1（2026-11-24），票据 panx635/jxc#15
  问题：30 单/天、一单 2-3 分钟（含打印）、1-3 人的五金水暖店，销售单开单页该长什么样？
  四个结构变体：?variant=A|B|C|D。这是抛掷物：只验证结构，不验证视觉；数据全假，内存态，刷新即清。
-->
<style>
:root{
  --ink:#171717; --muted:#6d6d68; --faint:#9a9a94;
  --line:#c7c7c0; --line2:#e4e4de; --bg:#ecece8; --paper:#fff;
  --accent:#1f4fd8; --accent-weak:#e9eefc;
  --warn:#9a5700; --warn-bg:#fff3df; --ok:#177a35; --ok-bg:#e8f4ea; --bad:#a32424;
  --mono:ui-monospace,"Cascadia Mono",Consolas,"Courier New",monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.45 "Segoe UI","Microsoft YaHei",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;background:#fff;border:1px solid var(--line);border-radius:2px;padding:5px 10px}
button:hover{background:#f6f6f2}
button:disabled{opacity:.45;cursor:not-allowed}
input,select,textarea{font:inherit;color:inherit;background:#fff;border:1px solid var(--line);border-radius:2px;padding:4px 6px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent-weak);border-color:var(--accent)}
kbd{font:10px var(--mono);border:1px solid var(--line);border-bottom-width:2px;border-radius:3px;padding:0 4px;background:#fbfbf8;color:var(--muted)}
h1,h2,h3,h4{margin:0}
.sub{color:var(--muted);font-size:11.5px}
.mono{font-family:var(--mono)}
.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.primary:hover{background:#1a45bd}
.ghost{background:transparent}
.danger{color:var(--bad)}
.hidden{display:none!important}

/* ---------- prototype console ---------- */
#console{height:48px;display:flex;align-items:center;gap:14px;padding:0 14px;background:#141414;color:#eee;position:sticky;top:0;z-index:80;font-size:12px}
#console .pbadge{background:#f2c94c;color:#111;font-weight:800;font-size:9.5px;letter-spacing:.1em;padding:3px 6px;border-radius:2px}
#console .vname{font-weight:600;min-width:130px}
#console .metric{display:flex;align-items:baseline;gap:5px;color:#ddd}
#console .metric b{font:600 14px/1 var(--mono);color:#fff}
#console .metric small{font-size:10px;color:#8f8f8f}
#console .spacer{flex:1}
#console button{background:#242424;border-color:#3a3a3a;color:#ddd;font-size:11px;padding:4px 8px}
#console button:hover{background:#313131}
#console .ticketlink{color:#9fb4ef;text-decoration:none;font-size:11px}

/* ---------- switcher ---------- */
#switcher{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:90;display:flex;align-items:center;gap:2px;background:#141414;color:#fff;border-radius:999px;padding:4px;box-shadow:0 6px 22px rgba(0,0,0,.28)}
#switcher button{width:32px;height:30px;border:0;background:transparent;color:#fff;font-size:15px;border-radius:999px;padding:0}
#switcher button:hover{background:#2e2e2e}
#switcher .vlabel{min-width:170px;text-align:center;font-size:11.5px;letter-spacing:.02em}
#switcher .vlabel b{color:#f2c94c;margin-right:4px}
#switcher .khint{font-size:9.5px;color:#8d8d8d;padding:0 8px 0 4px;border-left:1px solid #333}

/* ---------- app frame ---------- */
#app{height:calc(100vh - 48px);padding-bottom:56px;overflow:hidden}

/* ---------- dropdowns ---------- */
.dropdown{position:absolute;top:calc(100% + 3px);left:0;z-index:60;background:var(--paper);border:1px solid var(--ink);box-shadow:0 10px 30px rgba(0,0,0,.16);min-width:100%}
.dd-row{display:flex;align-items:center;gap:8px;padding:6px 9px;border-bottom:1px solid var(--line2);cursor:pointer;font-size:12px}
.dd-row:last-child{border-bottom:0}
.dd-row:hover,.dd-row.active{background:var(--accent-weak)}
.dd-row .meta{margin-left:auto;color:var(--muted);font-size:11px;text-align:right}
.dd-foot{padding:5px 9px;border-top:1px solid var(--line);background:#f7f7f2;color:var(--muted);font-size:10.5px}
.prodrow{display:flex;align-items:flex-start;gap:9px;padding:7px 9px;border-bottom:1px solid var(--line2);cursor:pointer}
.prodrow:hover,.prodrow.active{background:var(--accent-weak)}
.prodrow .rk{width:16px;color:var(--faint);font:10px var(--mono);padding-top:2px}
.prodrow .pmain{flex:1;min-width:0}
.prodrow .pname{font-weight:600}
.prodrow .pspec{color:#333;margin-left:5px}
.prodrow .psub{color:var(--muted);font-size:10.5px;margin-top:1px}
.prodrow .pprice{text-align:right;font:600 12px var(--mono);white-space:nowrap}
.prodrow .pprice small{display:block;font-weight:400;color:var(--muted);font-size:10px}
.match{display:inline-block;font-size:9px;border:1px solid var(--line);background:#fbfbf8;color:var(--muted);padding:0 3px;margin-left:5px;vertical-align:1px}

/* ---------- A: one-screen ------------------------------ */
.a-app{height:100%;display:flex;flex-direction:column;min-height:0}
.a-head{background:var(--paper);border-bottom:1px solid var(--line);padding:8px 14px 7px}
.a-head-top{display:flex;align-items:center;gap:12px}
.a-logo{font:700 17px/1 var(--mono);letter-spacing:-.03em}
.a-logo span{font:400 10px/1 "Microsoft YaHei";color:var(--muted);margin-left:5px;letter-spacing:0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:2px;overflow:hidden}
.seg button{border:0;border-right:1px solid var(--line);border-radius:0;padding:4px 10px;background:#fff;font-size:12px}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--ink);color:#fff}
.a-docno{color:var(--muted);font-size:11.5px}
.a-mini{font:11px var(--mono);color:var(--muted)}
.a-head-meta{display:flex;align-items:center;gap:9px;margin-top:7px;flex-wrap:wrap}
.a-head-meta label{font-size:11px;color:var(--muted)}
.combo{position:relative;width:250px}
.combo input{width:100%;padding-right:22px;font-weight:600}
.combo .caret{position:absolute;right:7px;top:5px;color:var(--muted);pointer-events:none;font-size:11px}
.recv{font:11px var(--mono);color:var(--muted)}
.autosave{margin-left:auto;font-size:10.5px;color:var(--faint)}
.a-sheet{flex:1;min-height:0;display:flex;flex-direction:column;margin:9px 14px 0;background:var(--paper);border:1px solid var(--line)}
.a-tools{display:flex;align-items:center;gap:8px;padding:7px 8px;border-bottom:1px solid var(--line);background:#fafaf6}
.a-search{position:relative;width:520px;max-width:52vw}
.a-search input{width:100%;padding:6px 9px;border-color:var(--ink)}
.a-search .k{position:absolute;right:7px;top:6px}
.a-tools .hint{color:var(--faint);font-size:10.5px;margin-left:auto;white-space:nowrap}
.cols{position:relative;font-size:11px}
.cols summary{list-style:none;cursor:pointer;border:1px solid var(--line);padding:5px 8px;background:#fff;border-radius:2px;user-select:none}
.cols summary::-webkit-details-marker{display:none}
.cols[open] summary{border-color:var(--ink);background:#fafaf6}
.colsbody{position:absolute;top:calc(100% + 3px);right:0;z-index:30;background:#fff;border:1px solid var(--ink);padding:8px 9px;width:148px;display:flex;flex-direction:column;gap:5px;box-shadow:0 8px 20px rgba(0,0,0,.12)}
.colsbody label{display:flex;gap:6px;align-items:center;white-space:nowrap;cursor:pointer}
.a-grid{flex:1;min-height:0;overflow:auto}
table.lines{width:100%;border-collapse:collapse;font-size:12.5px}
table.lines th{position:sticky;top:0;z-index:2;background:#f4f4ee;text-align:left;font-weight:600;font-size:11px;color:#4b4b46;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
table.lines td{padding:4px 8px;border-bottom:1px solid var(--line2);vertical-align:middle}
table.lines tbody tr:hover{background:#fbfbf7}
table.lines .idx{width:28px;color:var(--faint);font:10px var(--mono)}
table.lines .pn{font-weight:600}
table.lines .pspec{color:#333;font-size:12px}
table.lines .num{text-align:right;font-family:var(--mono)}
table.lines input.qty{width:58px;text-align:right;font-family:var(--mono);padding:3px 4px}
table.lines input.price{width:76px;text-align:right;font-family:var(--mono);padding:3px 4px}
table.lines .amt{text-align:right;font-family:var(--mono);font-weight:600;white-space:nowrap}
table.lines .unit{width:54px}
table.lines .stock{width:64px;text-align:right;font-family:var(--mono);color:var(--muted)}
table.lines .lastp{width:78px;text-align:right;font-family:var(--mono);color:var(--muted)}
.tagline{display:inline-block;font-size:9.5px;padding:0 4px;border:1px solid var(--line);background:#fafaf6;color:var(--muted);margin-left:4px;vertical-align:1px;white-space:nowrap}
.tagline.warn{border-color:#e7c58e;background:var(--warn-bg);color:var(--warn)}
.tagline.ok{border-color:#b9d9c0;background:var(--ok-bg);color:var(--ok)}
.rowdel{border:0;background:transparent;color:var(--faint);padding:2px 5px;font-size:13px}
.rowdel:hover{color:var(--bad);background:transparent}
.empty{height:100%;min-height:180px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:6px;color:var(--faint);font-size:12px}
.empty b{color:#555;font-weight:600}
.a-foot{border-top:2px solid var(--ink);background:var(--paper);display:grid;grid-template-columns:230px 1fr 320px;gap:18px;padding:9px 14px 10px;align-items:start}
.a-foot .sumline{font-size:10.5px;color:var(--muted)}
.a-foot .big{font:700 26px/1.1 var(--mono);letter-spacing:-.02em}
.a-foot .bigsub{font-size:10.5px;color:var(--muted);margin-top:2px}
.a-mid{display:flex;flex-direction:column;gap:5px;font-size:11.5px}
.a-mid .l{display:flex;align-items:center;gap:7px}
.a-mid .l .lab{width:58px;color:var(--muted);text-align:right;flex:none}
.a-mid input.disc{width:74px;text-align:right;font-family:var(--mono);padding:3px 4px}
.a-mid input.pay{width:92px;text-align:right;font-family:var(--mono);padding:3px 4px}
.a-mid select{width:76px;padding:3px 4px}
.a-mid .payhint{color:var(--faint);font-size:10.5px}
.a-mid .due{font-family:var(--mono);font-weight:600}
.a-right{display:flex;flex-direction:column;gap:6px;justify-content:flex-end;height:100%}
.a-right .primary{width:100%;padding:10px 12px;font-size:14px;display:flex;align-items:center;justify-content:center;gap:8px}
.a-right .row2{display:flex;gap:6px}
.a-right .row2 button{flex:1}
.a-banner{border:1px solid #b9d9c0;background:var(--ok-bg);color:var(--ok);padding:6px 9px;font-size:11.5px;display:flex;align-items:center;gap:10px;margin:7px 8px 0}
.a-banner b{font-family:var(--mono)}

/* ---------- B: two-step ------------------------------ */
.b-app{height:100%;display:flex;flex-direction:column;min-height:0;background:var(--paper)}
.b-steps{display:flex;align-items:center;gap:0;padding:0 16px;border-bottom:1px solid var(--line);background:#fafaf6;height:50px;flex:none}
.b-step{display:flex;align-items:center;gap:7px;padding:0 18px;height:100%;color:var(--muted);font-size:12px;border-right:1px solid var(--line2)}
.b-step i{font:700 10px var(--mono);font-style:normal;width:18px;height:18px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;background:#fff}
.b-step.on{color:var(--ink);font-weight:600;background:#fff}
.b-step.on i{background:var(--ink);color:#fff;border-color:var(--ink)}
.b-step.done{color:var(--ok)}
.b-step.done i{background:var(--ok-bg);border-color:#b9d9c0;color:var(--ok)}
.b-steps .spacer{flex:1}
.b-body{flex:1;min-height:0;display:flex}
.b-step-pane{flex:1;display:flex;min-height:0}
.b-custwrap{flex:1;overflow:auto;padding:26px 40px;max-width:1040px;margin:0 auto}
.b-h{font-size:20px;font-weight:700;letter-spacing:-.02em;margin-bottom:4px}
.b-sub{color:var(--muted);font-size:12px;margin-bottom:16px}
.b-search{position:relative;width:560px;max-width:100%}
.b-search input{width:100%;padding:9px 11px;font-size:14px;border-color:var(--ink)}
.b-recent{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:16px 0 20px}
.b-ccard{border:1px solid var(--line);padding:10px;text-align:left;background:#fff;border-radius:2px}
.b-ccard:hover{border-color:var(--ink);background:#fafaf6}
.b-ccard b{display:block;font-size:13px}
.b-ccard span{font-size:10.5px;color:var(--muted)}
.b-ccard .r{font-family:var(--mono);font-size:11px;margin-top:4px;color:#444}
.b-ctable{width:100%;border-collapse:collapse;font-size:12.5px}
.b-ctable th{text-align:left;font-size:10.5px;color:var(--muted);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line);background:#fafaf6}
.b-ctable td{padding:7px 8px;border-bottom:1px solid var(--line2)}
.b-ctable tr{cursor:pointer}
.b-ctable tr:hover td{background:var(--accent-weak)}
.b-left{flex:1.25;min-width:0;display:flex;flex-direction:column;border-right:1px solid var(--line)}
.b-right{width:460px;flex:none;display:flex;flex-direction:column;min-height:0;background:#fafaf6}
.panel-h{display:flex;align-items:center;gap:9px;padding:9px 12px;border-bottom:1px solid var(--line);background:#fafaf6;font-size:12px;flex:none}
.panel-h b{font-size:12.5px}
.panel-h .spacer{flex:1}
.panel-h .who{color:var(--muted);font-size:11px}
.b-prodwrap{flex:1;display:flex;flex-direction:column;min-height:0}
.b-prodsearch{padding:8px 12px;border-bottom:1px solid var(--line2)}
.b-prodsearch input{width:100%;padding:7px 9px;border-color:var(--ink)}
.b-results{flex:1;overflow:auto}
.b-prow{display:flex;align-items:flex-start;gap:10px;padding:9px 12px;border-bottom:1px solid var(--line2);cursor:pointer}
.b-prow:hover{background:#fbfbf7}
.b-prow .pmain{flex:1;min-width:0}
.b-prow .pn{font-weight:600}
.b-prow .spec{color:#333;margin-left:6px}
.b-prow .meta{color:var(--muted);font-size:10.5px;margin-top:2px}
.b-prow .pp{font:600 12px var(--mono);text-align:right;white-space:nowrap}
.b-prow .pp small{display:block;font-weight:400;color:var(--muted);font-size:10px}
.b-prow .add{border:1px solid var(--accent);color:var(--accent);background:#fff;padding:3px 9px;font-size:11px;margin-top:2px}
.b-cart{flex:1;overflow:auto}
.b-cart table{width:100%;border-collapse:collapse;font-size:12px}
.b-cart th{text-align:left;font-size:10px;color:var(--muted);font-weight:600;padding:5px 6px;border-bottom:1px solid var(--line2)}
.b-cart td{padding:5px 6px;border-bottom:1px solid var(--line2);vertical-align:middle}
.b-cart .nm{font-weight:600;font-size:11.5px}
.b-cart .sp{color:var(--muted);font-size:10px}
.b-cart input.qty{width:46px;text-align:right;font-family:var(--mono);padding:2px 3px}
.b-cart input.price{width:62px;text-align:right;font-family:var(--mono);padding:2px 3px}
.b-cart .amt{font-family:var(--mono);text-align:right;font-weight:600;white-space:nowrap}
.b-totals{padding:9px 12px;border-top:1px solid var(--line);background:#fff;flex:none}
.b-totals .row{display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px}
.b-totals .row.big{font-size:17px;font-weight:700;font-family:var(--mono);margin-top:5px}
.b-totals .muted{color:var(--muted);font-size:10.5px}
.b-actions{display:flex;gap:7px;padding:9px 12px;border-top:1px solid var(--line);background:#fff;flex:none}
.b-actions button{flex:1;padding:9px}
.b-empty{padding:26px 12px;color:var(--faint);font-size:12px;text-align:center}
.b-paywrap{flex:1;overflow:auto;padding:24px 32px;max-width:900px;margin:0 auto;width:100%}
.b-paycard{border:1px solid var(--line);background:#fff;padding:16px}
.b-paygrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.b-field label{display:block;font-size:11px;color:var(--muted);margin-bottom:3px}
.b-field input,.b-field select{width:100%;padding:7px 8px}
.b-summary{margin-top:14px;border-top:1px solid var(--line2);padding-top:10px;font-size:12px}
.b-summary .r{display:flex;justify-content:space-between;padding:3px 0}

/* ---------- C: wizard ------------------------------ */
.c-app{height:100%;overflow:auto;padding:22px 20px 40px;background:var(--bg)}
.c-wrap{max-width:940px;margin:0 auto}
.c-steps{display:flex;gap:0;margin-bottom:14px;background:#fff;border:1px solid var(--line)}
.c-step{flex:1;display:flex;align-items:center;gap:7px;padding:9px 12px;border-right:1px solid var(--line2);color:var(--muted);font-size:11.5px}
.c-step:last-child{border-right:0}
.c-step i{font:700 10px var(--mono);font-style:normal;width:18px;height:18px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;background:#fafaf6}
.c-step.on{color:var(--ink);font-weight:600;background:#f4f6fc}
.c-step.on i{background:var(--accent);border-color:var(--accent);color:#fff}
.c-step.done i{background:var(--ok-bg);border-color:#b9d9c0;color:var(--ok)}
.c-card{background:#fff;border:1px solid var(--line);padding:20px 22px;min-height:420px}
.c-card h2{font-size:18px;letter-spacing:-.01em;margin-bottom:2px}
.c-card .c-lead{color:var(--muted);font-size:12px;margin-bottom:16px}
.c-nav{display:flex;justify-content:space-between;gap:8px;margin-top:12px}
.c-nav button{padding:8px 16px}
.c-nav .primary{min-width:140px}
.c-search{position:relative;width:100%}
.c-search input{width:100%;padding:9px 10px;border-color:var(--ink)}
.c-results{margin-top:8px;border:1px solid var(--line);max-height:250px;overflow:auto;background:#fdfdfa}
.c-prow{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border-bottom:1px solid var(--line2);cursor:pointer}
.c-prow:hover{background:var(--accent-weak)}
.c-prow .pmain{flex:1}
.c-prow .pn{font-weight:600}
.c-prow .meta{font-size:10.5px;color:var(--muted)}
.c-prow .pp{font-family:var(--mono);font-size:11.5px;text-align:right}
.c-cart{margin-top:12px;border:1px solid var(--line)}
.c-cart table{width:100%;border-collapse:collapse;font-size:12px}
.c-cart th{text-align:left;font-size:10px;color:var(--muted);padding:5px 7px;border-bottom:1px solid var(--line);background:#fafaf6}
.c-cart td{padding:5px 7px;border-bottom:1px solid var(--line2)}
.c-cart .nm{font-weight:600}
.c-cart .sp{font-size:10px;color:var(--muted)}
.c-cart input.qty{width:52px;text-align:right;font-family:var(--mono);padding:2px 4px}
.c-cart input.price{width:66px;text-align:right;font-family:var(--mono);padding:2px 4px}
.c-cart .amt{text-align:right;font-family:var(--mono);font-weight:600}
.c-tot{margin-top:10px;display:flex;justify-content:flex-end;gap:28px;align-items:baseline}
.c-tot .lbl{font-size:11px;color:var(--muted)}
.c-tot .v{font:700 19px var(--mono)}
.c-fields{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:12px}
.c-fields label{display:block;font-size:11px;color:var(--muted);margin-bottom:3px}
.c-fields input,.c-fields select{width:100%;padding:8px 9px}
.c-summary{border:1px solid var(--line);margin-top:12px}
.c-summary .r{display:flex;justify-content:space-between;padding:7px 10px;border-bottom:1px solid var(--line2);font-size:12px}
.c-summary .r:last-child{border-bottom:0}
.c-summary .r.big{font-size:15px;font-weight:700;font-family:var(--mono)}
.c-recent{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.c-ccard{border:1px solid var(--line);padding:9px 10px;text-align:left;background:#fff}
.c-ccard:hover{border-color:var(--ink)}
.c-ccard b{display:block;font-size:12.5px}
.c-ccard span{font-size:10px;color:var(--muted);font-family:var(--mono)}

/* ---------- D: phone ------------------------------ */
.d-stage{height:100%;display:flex;align-items:center;justify-content:center;background:#d9d9d3;padding:10px}

function $(s){ return document.querySelector(s); }
function setText(sel, txt){ const el=$(sel); if(el) el.textContent = txt; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmt(n){ const v = Math.round((Number(n)||0)*100)/100; return v.toFixed(2); }
function norm(s){ return String(s||'').normalize('NFKC').toLowerCase().replace(/\s+/g,' ').trim(); }
function nowTime(){ const d=new Date(); return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')+':'+String(d.getSeconds()).padStart(2,'0'); }
function toast(msg, kind){

  if(!t) return;
  t.textContent = msg;
  t.className = 'show ' + (kind||'');
  clearTimeout(toast._t);
  toast._t = setTimeout(function(){ t.className = ''; }, 2800);
}

  return {count:S.lines.length, gross, discount, payable, pay, due:payable-pay};
}

    case 'l1': return has('p_ppr20_28',10);
    case 'l2': return has('p_elbow20',20);
    case 'l3': return has('p_tape',5);
    case 'l4': return has('p_valve20',2,28);
    case 'l5': return has('p_hose50',4);
    case 'l6': return has('p_glue',3);
    case 'pay': return S.payMethod==='微信' && Math.abs((Number(S.payAmount)||0)-300)<0.005;
    case 'eff': return S.effective;
  }
  return false;
}
function taskCount(){ return TASK_VISIBLE.filter(t=>taskDone(t.id)).length; }

/* ============================== 检索 ============================== */
function scoreToken(p, t){
  const code = norm(p.code), codeFlat = code.replace(/[-\s]/g,'');
  const tf = t.replace(/[-\s]/g,'');
  const name = norm(p.name), spec = norm(p.spec), alias = norm(p.aliases||''), all = name+' '+spec+' '+alias;
  if(tf && codeFlat === tf) return 1000;
  if(tf && codeFlat.startsWith(tf)) return 800;
  if(tf && codeFlat.includes(tf)) return 600;
  const specParts = spec.split(/[\s/]+/).filter(Boolean);
  if(specParts.includes(t)) return 500;
  if(spec.includes(t)) return 420;
  if(name.includes(t)) return 400;
  if(alias.includes(t)) return 300;
  if(all.replace(/\s+/g,'').includes(t)) return 120;
  return 0;
}
function searchProducts(q, c){
  const tokens = norm(q).split(/\s+/).filter(Boolean);
  if(!tokens.length) return [];
  const scored = [];
  for(const p of PRODUCTS){
    let score = 0, ok = true;
    for(const t of tokens){
      const s = scoreToken(p,t);
      if(!s){ ok=false; break; }
      score += s;
    }
    if(!ok) continue;
    if(c && c.recent && c.recent.includes(p.id)) score += 30;
    if(p.stock>0) score += 5;
    scored.push({p, score});
  }
  scored.sort((a,b)=> b.score-a.score || a.p.name.localeCompare(b.p.name,'zh'));
  return scored.slice(0,8).map(x=>x.p);
}
function searchCustomers(q){
  const nq = norm(q);
  return CUSTOMERS.filter(c => !nq || norm(c.name).includes(nq) || norm(c.py).includes(nq) || norm(c.name).replace(/\s/g,'').includes(nq.replace(/\s/g,''))).slice(0,8);
}

function startTimer(){
  if(S.startedAt || S.effective) return;
  S.startedAt = Date.now();
  if(S.timerId) clearInterval(S.timerId);
  S.timerId = setInterval(updateTimer, 250);
  updateTimer();
}
function stopTimer(){
  if(S.startedAt && !S.stoppedAt) S.stoppedAt = Date.now();
  if(S.timerId){ clearInterval(S.timerId); S.timerId=null; }
  updateTimer();
}
function elapsedMs(){
  if(!S.startedAt) return 0;
  return (S.stoppedAt || Date.now()) - S.startedAt;
}
function fmtMs(ms){
  const s = Math.floor(ms/1000);
  return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
}
function updateTimer(){
  const txt = fmtMs(elapsedMs());
  setText('#timerTop', txt);
  setText('#drawerTimer', txt);
  setText('#keysTop', S.keys);

}

function chooseCustomer(id){
  const c = CUSTOMERS.find(x=>x.id===id); if(!c) return;
  S.customerId = id;
  S.search = '';
  for(const l of S.lines){
    if(!l.override){ const p=product(l.pid); if(p) l.price = resolvePrice(p, c); }
  }
  if(S.variant==='B' && S.stepB===1) S.stepB = 2;
  if(S.variant==='C' && S.stepC===1) S.stepC = 2;
  S.dCustOpen = false;

  setTimeout(focusSearch, 30);
}
function addProduct(pid){
  const p = product(pid); if(!p) return;
  const c = customer();
  const price = resolvePrice(p, c);
  const existing = S.lines.find(l => l.pid===pid && Math.abs(l.price-price)<0.005 && !l.override);
  if(existing){
    existing.qty += 1;
    lastLineId = existing.id;
    markDirty();
    render();
    toast('已在单上，' + p.name + ' 数量 +1', 'ok');
  } else {
    const l = {id:'l'+Date.now()+Math.floor(Math.random()*1000), pid, qty:1, price, override:false, unit:p.unit, remark:''};
    S.lines.push(l);
    lastLineId = l.id;
    markDirty();
    render();
  }
  S.search = '';
  if(S.variant==='D') S.dSearchOpen = false;
  const el = document.getElementById('prodSearch');
  if(el){ el.focus(); }
  setTimeout(()=>{
    const q = document.querySelector('.qty[data-lid="'+lastLineId+'"]');
    if(q){ q.focus(); q.select(); }
  }, 10);
}

function onQty(lid, el){
  const l = lineById(lid); if(!l) return;
  l.qty = Math.max(0, Number(el.value)||0);
  const tr = el.closest('tr') || el.closest('.d-line');

  updateTotalsDom(); markDirty(); renderTask();

function onPriceChange(lid, el){
  const l = lineById(lid); if(!l) return;
  const p = product(l.pid);
  const c = customer();
  const resolved = resolvePrice(p, c);
  const nv = Math.round((Number(el.value)||0)*100)/100;
  if(!el.value || isNaN(Number(el.value))){ el.value = fmt(l.price); return; }
  if(Math.abs(nv-l.price)<0.005){ el.value=fmt(l.price); return; }
  const diff = Math.round((resolved - nv)*100)/100;
  const body = '<p><b>'+esc(p.name)+' '+esc(p.spec)+'</b></p>'
    + '<div class="pricebox"><span>解析价 ¥'+fmt(resolved)+'</span><span>→</span><span class="new">¥'+fmt(nv)+'</span>'
    + (diff>0 ? '<span class="danger">让价 ¥'+fmt(diff)+'</span>' : '<span class="sub">高于解析价</span>') + '</div>'
    + '<p class="sub">'+(diff>0 ? '让价会记入「今日让价」清单，首页可见。' : '高于解析价不需要让价审批。')+' 改价后仍可继续编辑。</p>';
  openConfirm({
    title:'成交价 ≠ 价格表解析价',
    body,
    okText:'确认改价',
    onOk:()=>{ l.price=nv; l.override=true; markDirty(); render(); toast('已改价，行价 ¥'+fmt(nv), 'warn'); },
    onCancel:()=>{ el.value = fmt(l.price); }
  });
}

function onProdSearch(q){
  S.search = q;
  S.activeSearch = 0;
  const list = document.getElementById('prodList'); if(!list) return;
  let html = '';
  if(!norm(q)){
    const c = customer();
    const rec = c && c.recent && c.recent.length ? c.recent.map(product).filter(Boolean) : [];
    const pop = PRODUCTS.filter(p=>p.stock>0).slice(0,6);
    const items = (rec.length?rec:pop).slice(0,6);
    html += '<div class="dd-foot">'+(c ? esc(c.name)+' 最近买过 / 常用商品' : '常用商品（选客户后按该客户最近购买排序）')+'</div>';
    html += items.map((p,i)=>prodRow(p,i,0)).join('');
  } else {
    const res = searchProducts(q, customer());
    S.currentResults = res.map(p=>p.id);
    html += res.length ? res.map((p,i)=>prodRow(p,i,1)).join('') : '<div class="dd-row sub">没搜到。试试编码、名称或规格，空格分词（如「DN20 内丝」）</div>';
    html += '<div class="dd-foot">排序：编码精确 → 编码前缀 → 规格词 → 名称 → 别名；同分把本客户买过的、有库存的提前</div>';
  }
  list.innerHTML = html; list.style.display='block';
}
function prodRow(p, i, ranked){
  const c = customer();
  const rp = resolvePrice(p,c), lp = lastPrice(p,c);
  const codeHit = norm(p.code).replace(/[-\s]/g,'').includes(norm(S.search).replace(/[-\s]/g,'')) && norm(S.search);
  const specHit = norm(S.search).split(/\s+/).filter(Boolean).some(t=>norm(p.spec).includes(t));
  const match = !norm(S.search) ? '' : (codeHit ? '<span class="match">编码</span>' : (specHit ? '<span class="match">规格</span>' : '<span class="match">名称/别名</span>'));
  return '<div class="prodrow '+(i===S.activeSearch?'active':'')+'" data-i="'+i+'" onmousedown="addProduct(\''+p.id+'\')">'
    + '<div class="rk">'+(ranked?(i+1):'·')+'</div>'
    + '<div class="pmain"><div><span class="pname">'+esc(p.name)+'</span><span class="pspec">'+esc(p.spec)+'</span>'+match+'</div>'
    + '<div class="psub">'+esc(p.code)+' · 库存 '+p.stock+' '+esc(p.unit)+(lp?' · 上次 ¥'+fmt(lp):'')+'</div></div>'
    + '<div class="pprice">¥'+fmt(rp)+(lp?'<small>上次 ¥'+fmt(lp)+'</small>':'')+'</div></div>';
}
function onProdKey(e){
  const list = document.getElementById('prodList');
  if(!list || list.style.display==='none') { if(e.key==='Enter') return; }
  const n = S.currentResults.length;
  if(e.key==='ArrowDown'){ e.preventDefault(); if(n){ S.activeSearch=(S.activeSearch+1)%n; repaintProdActive(); } }
  else if(e.key==='ArrowUp'){ e.preventDefault(); if(n){ S.activeSearch=(S.activeSearch-1+n)%n; repaintProdActive(); } }
  else if(e.key==='Enter'){
    e.preventDefault();
    const id = S.currentResults[S.activeSearch];
    if(id) addProduct(id);
  }
  else if(e.key==='Escape'){ list.style.display='none'; }
}

  if(step===1) return cStep1();

  return cStep4();
}

      + '<div class="pp">¥'+fmt(rp)+'</div></div>';

function goStepC(n){
  if(n<1||n>4) return;
  if(n>=2 && !S.customerId){ toast('先选客户','warn'); return; }
  if(n>=3 && !S.lines.length){ toast('先加至少一行','warn'); return; }
  S.stepC=n; render();
  if(n===2) setTimeout(focusSearch,20);
  if(n===3) setTimeout(function(){ const p=document.getElementById('payInput'); if(p){ p.focus(); p.select(); } },20);
}

/* ============================== 自测（?selftest=1） ============================== */
function runSelfTest(){
  const log=[];
  function mouse(el,type){ if(!el){ log.push('missing element'); return false; } el.dispatchEvent(new MouseEvent(type,{bubbles:true})); return true; }
  try{
    const ci=document.getElementById('custInput');
    if(ci){ ci.value='王'; ci.dispatchEvent(new Event('input',{bubbles:true})); const cr=document.querySelector('#custList .dd-row'); if(cr) mouse(cr,'mousedown'); else log.push('no customer row'); }
    const steps=[['PPR-20-28',10],['PPR-20-90',20],['SLD',5],['TQ-20',2],['RG-50',4],['BLJ-ZX',3]];
    for(const pair of steps){
      const q=pair[0], qty=pair[1];
      const si=document.getElementById('prodSearch'); if(!si){ log.push('no prodSearch'); break; }
      si.value=q; si.dispatchEvent(new Event('input',{bubbles:true}));
      const pr=document.querySelector('#prodList .prodrow'); if(!pr){ log.push('no result '+q); continue; }
      mouse(pr,'mousedown');
      const qs=document.querySelectorAll('.qty'); const qEl=qs[qs.length-1];
      if(qEl){ qEl.value=String(qty); qEl.dispatchEvent(new Event('input',{bubbles:true})); }
      if(q==='TQ-20'){
        const ps=document.querySelectorAll('.price'); const pEl=ps[ps.length-1];
        if(pEl){ pEl.value='28'; pEl.dispatchEvent(new Event('change',{bubbles:true})); }
        const ok=document.querySelector('#modal .mfoot .primary'); if(ok) ok.click(); else log.push('no price modal');
      }
    }
    const pay=document.getElementById('payInput'); if(pay){ pay.value='300'; pay.dispatchEvent(new Event('input',{bubbles:true})); }
    const eff=Array.from(document.querySelectorAll('button')).filter(function(b){ return b.textContent.indexOf('生效并打印')>=0; })[0];
    if(eff) eff.click(); else log.push('no effective button');
    setTimeout(function(){
      const pr=document.querySelector('#modal .mfoot .primary'); if(pr) pr.click(); else log.push('no print modal');
      const out={log:log, lines:S.lines.map(function(l){ return {pid:l.pid,qty:l.qty,price:l.price,override:l.override}; }), task:taskCount(), doc:S.docNo, effective:S.effective, printed:S.printed, keys:S.keys, elapsed:fmtMs(elapsedMs()), total:totals()};
      const pre=document.createElement('pre'); pre.id='selftest'; pre.textContent=JSON.stringify(out,null,2); document.body.appendChild(pre);
    },400);
  }catch(e){ log.push('ERR '+e.message+' | '+(e.stack||'')); }
}
function runVariantTest(v){
  try{
    setVariant(v);
    S.customerId = null; S.lines = []; S.effective = false; S.docNo = ''; S.printed = 0; S.payAmount = 0;
    S.stepB = 1; S.stepC = 1; S.dCustOpen = false; S.dPayOpen = false; S.dSearchOpen = false; S.search = '';
    render();
    chooseCustomer('c_wang');
    addProduct('p_ppr20_28');
    if(v==='B') goStepB(3);
    if(v==='C'){ goStepC(3); goStepC(4); }
    if(v==='D') openDPay();
    const hasPay = !!document.getElementById('payInput');
    const pay = document.getElementById('payInput'); if(pay){ pay.value='300'; pay.dispatchEvent(new Event('input',{bubbles:true})); }
    const eff = Array.from(document.querySelectorAll('button')).filter(function(b){ return b.textContent.indexOf('并生效')>=0 || b.textContent.indexOf('生效并打印')>=0; })[0];
    if(eff) eff.click();
    setTimeout(function(){
      const h = document.querySelector('#modal h3');
      if(h && h.textContent.indexOf('收款多于应收')>=0){ const ok=document.querySelector('#modal .mfoot .primary'); if(ok) ok.click(); }
    },120);
    setTimeout(function(){
      const out = {v:v, lines:S.lines.length, task:taskCount(), effective:S.effective, doc:S.docNo, printed:S.printed, hasPay:hasPay, html:document.getElementById('app').innerHTML.length, fatal:(document.getElementById('app').innerHTML.indexOf('fatal')>=0)};
      const pre=document.createElement('pre'); pre.id='selftest'; pre.textContent=JSON.stringify(out); document.body.appendChild(pre);
    },300);
  }catch(e){
    const pre=document.createElement('pre'); pre.id='selftest'; pre.textContent=JSON.stringify({v:v, err:e.message, stack:e.stack}); document.body.appendChild(pre);
  }
}

    return '<li class="'+(done?'done':'')+'"><span class="t">'+esc(x.text)+'</span></li>';

      + '<li><b>屏幕是稀缺的</b>：明细行可滚动；客户、合计、收款、搜索必须常驻，否则每次滚动都是一次找回上下文。</li>'
      + '<li><b>打印是生效的副作用</b>，不是独立一步。生效即出纸，失败可补打；补打入口与打印入口同一位置。</li>'
      + '<li><b>报价单不是另一张表</b>：同一编辑器切模式；转销售单时锁价，改价留痕。</li>'
    + '</ul>'
    + '<h4>外部依据（一手，2026-11-24 调研）</h4>'
    + '<ul>'
      + '<li><b>一屏是厂商主流</b>：金蝶云星辰官方把销售订单录入写成「基本信息框 = 表头、商品信息框 = 表体」，同页上下排列，下面还有合计区；不是分步也不是向导。</li>'
      + '<li><b>键盘流有据可依</b>：星辰快捷键面板里有 Shift+Insert 插行、Ctrl+F6 表头↔表体、Ctrl+P 打印；云星空把「回车切下一格 / 无下一焦点自动增行」做成按用户参数。</li>'
      + '<li><b>检索排序是自由裁量区</b>：核对的产品里没有一家官方写明「先命中编码还是名称、结果怎么排」；只有精斗云「一次最多 200 条」的截断。所以这张票要定死一条可实现的排序，并写进规格（建议 ADR）。</li>'
      + '<li><b>手机能开单，但打印受限</b>：星辰未审核单在手机端不显示打印按钮、超次数要密码且须到电脑端；网上管家婆 APP 远程打印「暂时无法判断结果，需到 PC 端确认」；T+ 手机下单打印要一台装着网络打印插件的 PC。</li>'
    + '</ul>'
    + '<p class="sub">调研笔记：docs/research/2026-11-24-order-entry.md（research/order-entry-ux 分支，168 行，10 条官方未说明）。</p>'
    + '<h4>本版故意没做的</h4>'
    + '<ul><li>视觉与品牌、动效、响应式细节。</li><li>真实打印与纸张尺寸（只做纸面预览）。</li><li>后端、登录、权限过滤（看成本开关、让价清单仅示意）。</li><li>扫码：主数据票已定「不做扫码」。</li></ul>'
    + '<h4>当前状态</h4>'
    + '<p class="sub">客户：'+esc(c?c.name:'未选')+' · 行数：'+t.count+' · 合计：¥'+fmt(t.payable)+' · 收款：'+esc(S.payMethod)+' ¥'+fmt(t.pay)+' · 生效：'+(S.effective?'是 '+S.docNo:'否')+'</p>'
    + '<p class="sub">原型文件：docs/prototypes/2026-11-24-order-entry.html · 票据 <a href="https://github.com/panx635/jxc/issues/15" target="_blank">#15</a></p>';
}

/* ============================== 变体切换 ============================== */
function setVariant(v){
  if(!VARIANTS[v]) return;
  S.variant = v;
  closeModal();
  try{ history.replaceState(null,'','?variant='+v); }catch(e){}
  render();
}
function cycleVariant(d){
  const keys = Object.keys(VARIANTS);
  const i = keys.indexOf(S.variant);
  setVariant(keys[(i+d+keys.length)%keys.length]);
}

/* ============================== 全局事件 ============================== */
document.addEventListener('keydown', function(e){
  if(e.key==='ArrowLeft' || e.key==='ArrowRight'){
    const t = e.target;
    if(t && t.matches && t.matches('input,textarea,select,[contenteditable]')) return;
    e.preventDefault(); cycleVariant(e.key==='ArrowLeft'?-1:1); return;
  }
  const inApp = e.target && e.target.closest && e.target.closest('#app');
  if(!inApp) return;
  if(!S.startedAt && !S.effective){ startTimer(); }
  if(!S.effective){ S.keys += 1; updateTimer(); }
  if(e.key==='F2'){ e.preventDefault(); focusSearch(); }
  if(e.key==='F4'){ e.preventDefault(); const p=document.getElementById('payInput'); if(p){ p.focus(); p.select(); } else if(S.variant==='B'){ S.stepB=3; render(); } else if(S.variant==='C'){ S.stepC=3; render(); } else if(S.variant==='D'){ S.dPayOpen=true; render(); } }
  if(e.key==='Enter' && (e.ctrlKey||e.metaKey)){ e.preventDefault(); makeEffective(); }
}, true);
document.addEventListener('mousedown', function(e){
  if(e.target && e.target.closest && e.target.closest('#app')){ if(!S.startedAt && !S.effective) startTimer(); }
  if(!e.target.closest || !e.target.closest('.combo') && !e.target.closest('.a-search') && !e.target.closest('.b-search') && !e.target.closest('.c-search')){
    document.querySelectorAll('.dropdown').forEach(el=>{ if(el.id!=='custList' && el.id!=='prodList') el.style.display='none'; });
  }
});
window.addEventListener('load', function(){
  const params = new URLSearchParams(location.search);
  const v = (params.get('variant')||'A').toUpperCase();
  S.variant = VARIANTS[v] ? v : 'A';
  if(params.get('demo')==='lines'){
    const c = CUSTOMERS.find(x=>x.id==='c_wang');
    S.customerId = 'c_wang';
    const demo = [['p_ppr20_28',10],['p_elbow20',20],['p_tape',5],['p_valve20',2],['p_hose50',4],['p_glue',3]];
    S.lines = demo.map(function(x,i){
      const p = PRODUCTS.find(function(y){ return y.id===x[0]; });
      return {id:'demo'+i, pid:p.id, qty:x[1], price:(p.id==='p_valve20'?28:resolvePrice(p,c)), override:(p.id==='p_valve20'), unit:p.unit, remark:''};
    });
    S.payAmount = 300;
    if(S.variant==='B') S.stepB = 2;
    if(S.variant==='C') S.stepC = 2;
  }
  render();
  const st = params.get('selftest');
  if(st==='1' || st==='A') setTimeout(runSelfTest, 500);
  else if(st==='B' || st==='C' || st==='D') setTimeout(function(){ runVariantTest(st); }, 500);
  if(!S.lines.length) setTimeout(focusSearch, 200);
});
</script>
