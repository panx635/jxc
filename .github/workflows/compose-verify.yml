name: Compose smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compose:
    name: docker compose up --build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run compose smoke
        run: |
          set -o pipefail
          bash scripts/compose-smoke.sh 2>&1 | tee compose-smoke-run.log
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compose-smoke
          path: |
            compose-smoke-run.log
            compose-smoke.log
          if-no-files-found: ignore
          retention-days: 7
